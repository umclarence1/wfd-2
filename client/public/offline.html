<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline — Wilberforce Data Service</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #ffffff;
        color: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.08);
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #eff6ff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2563eb;
        font-size: 1.75rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: #4b5563;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a,
      button {
        font: inherit;
        border: none;
        cursor: pointer;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        text-decoration: none;
        font-weight: 600;
      }
      .primary {
        background: #2563eb;
        color: #ffffff;
      }
      .secondary {
        background: #f3f4f6;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You are offline</h1>
      <p>
        You are offline. Some features like placing orders, payments, login, and live order tracking
        require internet. Please reconnect to continue.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="window.location.reload()">Try again</button>
        <a href="/" class="secondary">Go to homepage</a>
      </div>
    </div>
  </body>
</html>
